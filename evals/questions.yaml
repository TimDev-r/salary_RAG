    expect_source: {doc_id: it-kv-2026-de, short_title: IT-KV, section_ref: "§ 15"}
    source_quote: "4.476"
    source_note: >-
      it-kv-2026-de.pdf p26, § 15 III. Gehaltstabelle, row Erfahrungsstufe /
      column ST1. Independently confirmed by it-kv-2026-en.pdf p26 (4,476) and
      by WKO's Berechnungsbeispiele 2026, Beispiel 2 ("4.476,-").

