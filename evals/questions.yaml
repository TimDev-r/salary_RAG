  # -------------------------------------------------------- B. language pairs
  # Same fact, same year, asked in German and English. A paired comparison, so
  # any difference is attributable to the question language and not to the fact.

  - id: lang_arbeitszeit_de
    question: "Wie viele Stunden beträgt die wöchentliche Normalarbeitszeit nach dem IT-KV?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [language_pair, prose]
    expect: {any_of: ["38,5"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 4"}
    source_quote: "38,5 Stunden wöchentlich"
    source_note: 'it-kv-2026-de.pdf § 4 I. (1): "Die normale Arbeitszeit beträgt 38,5 Stunden wöchentlich".'

  - id: lang_arbeitszeit_en
    question: "How many hours per week are normal working hours under the IT collective agreement?"
    lang: en
    valid_year: 2026
    type: answerable
    tests: [language_pair, prose]
    expect: {any_of: ["38.5", "38,5"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 4"}
    source_quote: "38.5 hours per week"
    source_note: >-
      it-kv-2026-en.pdf § 4 I. (1): "Normal working hours are 38.5 hours per
      week". Note the English document writes 38.5 where the German writes 38,5.

