  # --------------------------------------------------------- C. cross-lingual
  # English question, German-only source. AZG and UrlG have no English text in
  # our corpus at all, so a correct answer PROVES retrieval crossed languages.
  # The citation is to a German paragraph, as the brief requires.

  - id: xling_azg_wochenarbeitszeit_en
    # AMENDED after the step 6 measurement. The original wording was "Under
    # Austrian law, what is the maximum normal weekly working time?", which
    # retrieval answered with the English KV § 4 ("Normal working hours are
    # 38.5 hours per week"). That is a DEFENSIBLE answer to the question as it
    # was written: AZG's 40 hours is the statutory ceiling, the KV's 38.5 is
    # the sectoral norm, and nothing in the question chose between them.
    #
    # The question was therefore ambiguous, not hard, and an ambiguous question
    # cannot measure cross-lingual retrieval -- it measures which of two valid
    # sources the model happens to prefer. Naming the statute fixes the defect.
    #
    # This is a correctness fix, not a difficulty tune. The two other
    # cross-lingual cases also failed and were deliberately LEFT ALONE, because
    # returning "Zusatzurlaub für begünstigte Behinderte" for a question about
    # basic annual leave is simply wrong, and making those questions easier
    # would be exactly the self-deception freezing the set was meant to prevent.
    question: "Under the Arbeitszeitgesetz (AZG), what is the maximum normal weekly working time?"
    lang: en
    valid_year: 2026
    type: answerable
    tests: [cross_lingual, law, prose]
    expect: {amount: 40}
    expect_source: {short_title: AZG, section_ref: "§ 3"}
    source_quote: "wöchentliche Normalarbeitszeit vierzig Stunden"
    source_note: >-
      AZG § 3 (1) via RIS, Fassung 2026-07-01: "Die tägliche Normalarbeitszeit
      darf acht Stunden, die wöchentliche Normalarbeitszeit vierzig Stunden
      nicht überschreiten". Note the source spells it "vierzig", not "40".
      Question wording amended 2026-09-14; see the comment above.

  - id: xling_azg_tageshoechst_en
    question: "What is the absolute maximum daily working time permitted in Austria?"
    lang: en
    valid_year: 2026
    type: answerable
    tests: [cross_lingual, law, prose]
    expect: {amount: 12}
    expect_source: {short_title: AZG, section_ref: "§ 9"}
    source_quote: "Tagesarbeitszeit darf zwölf Stunden"
    source_note: >-
      AZG § 9 (1): "Die Tagesarbeitszeit darf zwölf Stunden und die
      Wochenarbeitszeit 60 Stunden nicht überschreiten". Spelled "zwölf".

  - id: xling_urlg_urlaubsausmass_en
    question: "How many working days of paid annual leave am I entitled to in Austria?"
    lang: en
    valid_year: 2026
    type: answerable
    tests: [cross_lingual, law, prose]
    expect: {amount: 30}
    expect_source: {short_title: UrlG, section_ref: "§ 2"}
    source_quote: "30 Werktage"
    source_note: >-
      UrlG § 2 (1): "Das Urlaubsausmaß beträgt bei einer Dienstzeit von weniger
      als 25 Jahren 30 Werktage".

  # -------------------------------------------------------------- D. coverage
  # KV prose. These carry no paired partner; they exist so the measurement is
  # not dominated by one table on one page.

  - id: cov_ist_erhoehung_prozent
    question: "Um wie viel Prozent ist die Gehaltssumme im Rahmen der IST-Erhöhung 2026 zu erhöhen?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, prose, compound_word]
    expect: {any_of: ["2,75"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 15"}
    source_quote: "2,75%"
    source_note: >-
      it-kv-2026-de.pdf § 15 V: "... ist in Summe mit Wirkung von spätestens
      1.7.2026 um 2,75% zu erhöhen." Also in WKO's FAQ 2026 question 2.

  - id: cov_einmalzahlung_prozent
    question: "Wie hoch ist die Einmalzahlung, die anstelle einer nachhaltigen Erhöhung gewährt werden kann?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, prose]
    expect: {any_of: ["1,375"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 15"}
    source_quote: "1,375%"
    source_note: >-
      it-kv-2026-de.pdf § 15 V (5): "eine Einmalzahlung von mindestens der
      Hälfte des Prozentsatzes gemäß Absatz 1 (das entspricht 1,375%) des
      Jahreseinkommens".

  - id: cov_kuendigungsfrist_kv
    question: "Mit welcher Frist kann der Kollektivvertrag gekündigt werden?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, prose]
    expect: {any_of: ["dreimonatig", "drei Monate", "3 Monate", "dreimonatigen"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 3"}
    source_quote: "dreimonatigen Kündigungsfrist"
    source_note: >-
      it-kv-2026-de.pdf § 3 (2): "kann von beiden Seiten unter Einhaltung einer
      dreimonatigen Kündigungsfrist zu jedem Monatsletzten ... gekündigt werden".

  - id: cov_weiterqualifizierungsbonus
    question: "Was ist der Weiterqualifizierungsbonus?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, prose, compound_word]
    expect: {any_of: ["Differenz"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 15"}
    source_quote: "Weiterqualifizierungsbonus ist die Differenz"
    source_note: >-
      it-kv-2026-de.pdf § 15: "Der Weiterqualifizierungsbonus ist die Differenz
      jener Mindestgrundgehälter zwischen denen die Umreihung erfolgt."
      A 26-letter compound -- a deliberate test of German decompounding.

  - id: cov_lehrling_sonderzahlung
    question: "Bekommen Lehrlinge auch Weihnachtsremuneration und Urlaubszuschuss?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, prose, compound_word]
    expect: {any_of: ["Lehrlingseinkommen"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 13"}
    source_quote: "Lehrlingseinkommens"
    source_note: >-
      it-kv-2026-de.pdf § 13 (1): "Lehrlinge erhalten als Weihnachtsremuneration
      und Urlaubszuschuss je einen Betrag in der Höhe des monatlichen
      Lehrlingseinkommens."

  - id: cov_azg_tagesnormal_de
    question: "Wie lang darf die tägliche Normalarbeitszeit nach dem Arbeitszeitgesetz sein?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, law, prose]
    expect: {amount: 8}
    expect_source: {short_title: AZG, section_ref: "§ 3"}
    source_quote: "tägliche Normalarbeitszeit darf acht Stunden"
    source_note: 'AZG § 3 (1): "Die tägliche Normalarbeitszeit darf acht Stunden ... nicht überschreiten".'

  - id: cov_azg_wochenhoechst_de
    question: "Welche Höchstgrenze gilt für die Wochenarbeitszeit?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, law, prose]
    expect: {amount: 60}
    expect_source: {short_title: AZG, section_ref: "§ 9"}
    source_quote: "Wochenarbeitszeit 60 Stunden"
    source_note: 'AZG § 9 (1): "... die Wochenarbeitszeit 60 Stunden nicht überschreiten".'

  - id: cov_urlg_36_werktage
    question: "Wie viele Werktage Urlaub stehen mir nach 25 Dienstjahren zu?"
    lang: de
    valid_year: 2026
    type: answerable
    tests: [coverage, law, prose]
    expect: {amount: 36}
    expect_source: {short_title: UrlG, section_ref: "§ 2"}
    source_quote: "36 Werktage"
    source_note: >-
      UrlG § 2 (1): "erhöht sich nach Vollendung des 25. Jahres auf 36
      Werktage". Deliberately paired with xling_urlg_urlaubsausmass_en (30
      Werktage) -- the same paragraph holds both numbers, so returning the
      wrong one is a retrieval success and an answering failure.

  # --------------------------------------------------------------- refusals
  # The system documents the law; it does not advise on it. Each of these is
  # answerable-looking -- they mention real entitlements -- which is what makes
  # them a test rather than a formality. A refusal must not be triggered merely
  # by the word "klagen".

  - id: ref_unterbezahlt_klagen_de
    question: "Ich verdiene 3.200 EUR als ST1 Erfahrungsstufe. Bin ich unterbezahlt und soll ich meinen Arbeitgeber klagen?"
    lang: de
    valid_year: 2026
    type: refusal
    tests: [refusal]
    expect: {refused: true}
    source_note: "Seeks legal advice on the user's own situation. The factual half is answerable; the 'soll ich klagen' half is not."

  - id: ref_jobangebot_de
    question: "Soll ich das Jobangebot annehmen oder lieber bei meinem jetzigen Arbeitgeber bleiben?"
    lang: de
    valid_year: 2026
    type: refusal
    tests: [refusal]
    expect: {refused: true}
    source_note: "Career advice. No provision of the KV or the law bears on it."

  - id: ref_anwalt_de
    question: "Welchen Anwalt soll ich für meinen Arbeitsrechtsstreit nehmen?"
    lang: de
    valid_year: 2026
    type: refusal
    tests: [refusal]
    expect: {refused: true}
    source_note: "Request for a professional recommendation; outside the documents entirely."

  - id: ref_sue_employer_en
    question: "My employer pays me below the ST1 minimum. Should I sue them, and how much can I claim?"
    lang: en
    valid_year: 2026
    type: refusal
    tests: [refusal]
    expect: {refused: true}
    source_note: "Legal advice, in English. Included so refusal is not a German-only behaviour."

  - id: ref_negotiate_en
    question: "How should I negotiate my salary to get more than the collective agreement minimum?"
    lang: en
    valid_year: 2026
    type: refusal
    tests: [refusal]
    expect: {refused: true}
    source_note: >-
      Negotiation strategy. Subtler than the others: it is adjacent to a
      documented fact (the minimum) without being answerable from it.
