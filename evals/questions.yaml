  - id: lang_sonderzahlung_en
    question: "Am I entitled to a 13th and 14th monthly salary?"
    lang: en
    valid_year: 2026
    type: answerable
    tests: [language_pair, prose]
    expect: {any_of: ["13th and 14th"]}
    expect_source: {short_title: IT-KV, section_ref: "§ 13"}
    source_quote: "13th and 14th monthly salary"
    source_note: >-
      it-kv-2026-en.pdf § 13 (1): "All employees are entitled to a 13th and 14th
