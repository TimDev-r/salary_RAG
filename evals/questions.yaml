# Evaluation set for the AT-KV assistant.
#
# FROZEN BEFORE ANY RETRIEVAL TUNING. That ordering is the whole point. Written
# afterwards, these questions would unconsciously be ones the retriever already
# answers, and both headline measurements would become decoration.
#
# PROVENANCE
# ----------
# Every figure was read out of a source document and is recorded below with
# where it came from. Nothing is remembered, inferred or rounded. Where a value
# appears in more than one independent place (the DE PDF, the EN PDF, and WKO's
# Berechnungsbeispiele / FAQ pages), that is noted -- those are genuine
# cross-checks, since the documents were produced and parsed independently.
#
# The FAQ and Berechnungsbeispiele are the ANSWER KEY and are never indexed.
# Every question here is answerable from the indexed corpus alone (the four KV
# PDFs plus AZG and UrlG); facts that live only in the FAQ are excluded, because
# an unanswerable question measures nothing but our own confusion.
#
# expect        what the ANSWER must contain. May differ from the source: AZG
#               writes "vierzig Stunden", and a correct English answer says
#               "40 hours". Converting the one to the other is part of the task.
# source_quote  literal text that must appear in a chunk matching expect_source.
#               This is what makes the set self-verifying -- a question whose
#               supporting text is not actually in the corpus is a broken
#               question, and broken questions quietly punish the retriever for
#               our mistake.
#
# GROUND TRUTH REFERENCES (doc_id, section_ref), NEVER chunk_id.
# chunk_id is derived from position and changes whenever chunking changes --
# which it will. section_ref is a property of the source document.
#
# DESIGN
# ------
# Not every question is duplicated across languages. Blanket duplication doubles
# cost without doubling information and varies language even where language is
# not what is being measured. Instead there are controlled pairs on the three
# axes that matter:
#
#   version_filter  same question, valid_year 2025 vs 2026     (8 cases)
#   language_pair   same fact asked in German and English      (6 cases)
#   cross_lingual   English question, German-ONLY source        (3 cases)
#                   -- AZG/UrlG exist only in German, so an English question
#                      there has no choice but to retrieve German text. An
#                      English question about the KV would just hit the English
#                      KV and test nothing.
#   coverage        breadth across KV prose and law             (8 cases)
#
# Totals: 25 answerable + 5 refusal.

questions:

  # ---------------------------------------------------------------- A. version
