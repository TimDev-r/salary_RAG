[project]
name = "atkv"
version = "0.1.0"
description = "Retrieval over the Austrian IT collective agreement (IT-KV) and related labour law"
requires-python = ">=3.12,<3.13"

# Deliberately minimal for now. Heavy ML deps (torch, sentence-transformers)
# arrive in step 6, once we actually need to embed something. Keeping the first
# `uv sync` small means we can verify the arm64 toolchain in seconds, not after
# a 2.5 GB download.
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "sentencepiece>=0.2.2",
    "snowballstemmer>=3.1.1",
    "torch>=2.14.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atkv"]

# The chat UI is a package data file; without this it is missing from the
# wheel and the container serves a 500 at "/" while local dev works fine.
[tool.hatch.build.targets.wheel.force-include]
"src/atkv/static" = "atkv/static"

[tool.pytest.ini_options]
testpaths = ["evals", "tests"]

# ---------------------------------------------------------------------------
# torch from PyTorch's CPU index on Linux.
#
# PyPI's torch declares its CUDA dependencies with the marker
#   platform_system == "Linux"
# which is not gated on architecture. An ARM Linux container therefore pulls
# ~3.3 GB of x86-only nvidia wheels it can never execute -- measured: a 7.81 GB
# image of which 42% was dead CUDA.
#
# download.pytorch.org/whl/cpu publishes manylinux_2_28_aarch64 wheels without
# those dependencies. The marker keeps macOS on PyPI, where torch has no CUDA
# dependencies to begin with and where the MPS build is the one we want.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
