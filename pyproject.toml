[project]
name = "atkv"
version = "0.1.0"
description = "Retrieval over the Austrian IT collective agreement (IT-KV) and related labour law"
requires-python = ">=3.12,<3.13"

# Deliberately minimal for now. Heavy ML deps (torch, sentence-transformers)
# arrive in step 6, once we actually need to embed something. Keeping the first
# `uv sync` small means we can verify the arm64 toolchain in seconds, not after
# a 2.5 GB download.
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pdfplumber>=0.11.10",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "sentencepiece>=0.2.2",
    "snowballstemmer>=3.1.1",
    "torch>=2.14.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atkv"]

[tool.pytest.ini_options]
testpaths = ["evals", "tests"]
