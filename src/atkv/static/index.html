<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AT-KV Assistant</title>
<style>
  /* No CDN, no build step: the container has no outbound internet and the
     page must work offline from a baked image. */
  :root{
    --bg:#f7f7f8; --panel:#fff; --ink:#1a1a1c; --muted:#6b6b73;
    --line:#e4e4e8; --user:#1a1a1c; --userink:#fff;
    --accent:#2f5fd0; --chip:#eef2fb; --warn:#8a5a00; --warnbg:#fff6e5;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#16161a; --panel:#1e1e24; --ink:#ececed; --muted:#9a9aa4;
    --line:#2e2e37; --user:#3a3a46; --userink:#fff;
    --accent:#7aa2f7; --chip:#242b3d; --warn:#e0b060; --warnbg:#2a2418;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px 120px}
  header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:19px;margin:0;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px}
  .note{background:var(--warnbg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
        border-radius:9px;padding:9px 12px;font-size:13px;margin:14px 0 18px}
  .msgs{display:flex;flex-direction:column;gap:16px;margin-top:18px}
  .row{display:flex}
  .row.me{justify-content:flex-end}
  .bubble{max-width:min(90%,640px);padding:11px 14px;border-radius:15px;
          background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
  .row.me .bubble{background:var(--user);color:var(--userink);border-color:transparent;border-bottom-right-radius:5px}
  .row.bot .bubble{border-bottom-left-radius:5px}
  .cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .cite{display:inline-flex;align-items:center;gap:6px;background:var(--chip);color:var(--accent);
        border-radius:999px;padding:3px 10px;font-size:12px;text-decoration:none;font-weight:500}
  .cite small{color:var(--muted);font-weight:400}
  .meta{color:var(--muted);font-size:11.5px;margin-top:8px;font-variant-numeric:tabular-nums}
  .refused{border-left:3px solid var(--warn)}
  .dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin-right:3px;
             animation:b 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
       border-top:1px solid var(--line);padding:12px 16px}
  .bar .inner{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input[type=text]{flex:1 1 260px;min-width:0;padding:11px 13px;border:1px solid var(--line);
                   border-radius:11px;background:var(--panel);color:var(--ink);font:inherit}
  select,button{padding:11px 13px;border:1px solid var(--line);border-radius:11px;
                background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
  button.go{background:var(--accent);color:#fff;border-color:transparent;font-weight:600}
  button:disabled{opacity:.5;cursor:default}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chips button{font-size:12.5px;padding:6px 10px;border-radius:999px;color:var(--muted)}
  label{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AT-KV Assistant</h1>
    <span class="sub">Austrian IT collective agreement &amp; labour law — answered with a citation</span>
  </header>

  <div class="note" id="note">
    Change the <strong>year</strong> and ask the same question again. The 2025 and 2026
    agreements are ~95% identical text — only the numbers move — so the answer has to come
    from a filter on validity, not from similarity.
  </div>

  <div class="msgs" id="msgs"></div>
</div>

<div class="bar">
  <div class="inner">
    <input id="q" type="text" placeholder="Wie hoch ist das Mindestgrundgehalt für ST1 Erfahrungsstufe?" autocomplete="off">
    <label for="year">in force</label>
    <select id="year"><option>2026</option><option>2025</option></select>
    <select id="lang"><option value="de">DE</option><option value="en">EN</option></select>
    <button class="go" id="send">Ask</button>
  </div>
  <div class="inner chips">
    <button data-q="Wie hoch ist das Mindestgrundgehalt für ST1 Erfahrungsstufe?">ST1 Erfahrungsstufe</button>
    <button data-q="Wie hoch ist das monatliche Lehrlingseinkommen im ersten Lehrjahr?">Lehrlingseinkommen</button>
    <button data-q="Wie viele Werktage Urlaub stehen mir nach 25 Dienstjahren zu?">Urlaub nach 25 Jahren</button>
    <button data-q="Soll ich meinen Arbeitgeber klagen?">(advice — refused)</button>
  </div>
</div>

<script>
const msgs = document.getElementById('msgs');
const qEl = document.getElementById('q'), yearEl = document.getElementById('year'),
      langEl = document.getElementById('lang'), sendEl = document.getElementById('send');

function row(cls, html){
  const r = document.createElement('div'); r.className = 'row ' + cls;
  const b = document.createElement('div'); b.className = 'bubble';
  b.innerHTML = html; r.appendChild(b);
  msgs.appendChild(r); window.scrollTo(0, document.body.scrollHeight);
  return b;
}
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function ask(question){
  if(!question.trim()) return;
  row('me', esc(question));
  const bubble = row('bot', '<span class="dots"><span></span><span></span><span></span></span>');
  sendEl.disabled = true;

  const body = JSON.stringify({question, valid_year:+yearEl.value, lang:langEl.value, k:3});
  let answer = '', citesEl = null, metaEl = null, t0 = performance.now();

  try{
    const res = await fetch('/query/stream', {
      method:'POST', headers:{'content-type':'application/json'}, body
    });
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '', event = null;

    for(;;){
      const {done, value} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      const parts = buf.split('\n\n'); buf = parts.pop();
      for(const chunk of parts){
        for(const line of chunk.split('\n')){
          if(line.startsWith('event: ')) event = line.slice(7).trim();
          else if(line.startsWith('data: ')){
            const d = JSON.parse(line.slice(6));

            if(event === 'refusal'){
              bubble.className = 'bubble refused';
              bubble.textContent = d.answer;
            }
            else if(event === 'meta'){
              // Citations arrive BEFORE any answer text — they are known the
              // moment retrieval finishes, seconds ahead of the first token.
              bubble.innerHTML = '';
              const a = document.createElement('div'); bubble.appendChild(a);
              citesEl = document.createElement('div'); citesEl.className = 'cites';
              // Deduplicate by paragraph. k=3 usually returns three chunks of
              // the SAME section (a verbalised cell, the whole table, the
              // surrounding prose), and rendering three identical chips looks
              // like three independent sources confirming each other. It is one.
              const seen = new Set();
              const uniq = d.citations.filter(c => {
                const key = [c.short_title, c.year, c.section_ref, c.page].join('|');
                if(seen.has(key)) return false; seen.add(key); return true;
              });
              for(const c of uniq){
                const el = document.createElement('a');
                el.className = 'cite'; el.href = c.source_url; el.target = '_blank'; el.rel = 'noopener';
                const yr = c.year ? ' ' + c.year : '';
                el.innerHTML = `${esc(c.short_title + yr + ', ' + (c.section_ref||''))}` +
                               (c.page ? ` <small>p${c.page}</small>` : '');
                citesEl.appendChild(el);
              }
              bubble.appendChild(citesEl);
              metaEl = document.createElement('div'); metaEl.className = 'meta';
              metaEl.textContent = `in force ${d.as_of} · retrieval ${Math.round(d.retrieval_ms)} ms`;
              if(d.notice){ metaEl.textContent += ' · ' + d.notice; }
              bubble.appendChild(metaEl);
              bubble._answer = a;
            }
            else if(event === 'token'){
              answer += d.text;
              if(bubble._answer) bubble._answer.textContent = answer;
            }
            else if(event === 'done'){
              if(metaEl) metaEl.textContent += ` · total ${Math.round(d.latency_ms)} ms · ${d.provider}`;
            }
            else if(event === 'error'){
              bubble.textContent = 'Error: ' + d.error;
            }
          }
        }
      }
    }
  }catch(e){
    bubble.textContent = 'Request failed: ' + e.message;
  }
  sendEl.disabled = false; qEl.focus();
}

sendEl.onclick = () => { const v = qEl.value || qEl.placeholder; qEl.value=''; ask(v); };
qEl.onkeydown = e => { if(e.key === 'Enter') sendEl.click(); };
document.querySelectorAll('.chips button').forEach(b =>
  b.onclick = () => { qEl.value = b.dataset.q; sendEl.click(); });
</script>
</body>
</html>
